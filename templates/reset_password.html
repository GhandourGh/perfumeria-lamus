{% extends "_auth.html" %}
{% block title %}New password · Perfumería Lamus{% endblock %}
{% block card %}
  <div class="eyebrow">Account recovery</div>
  <h1>Choose a new password</h1>
  <p class="lede">Use at least 12 characters. You will sign in with it from now on.</p>
  <form method="post" data-guard>
    <label class="field">
      <span>New password</span>
      <input name="password" type="password" minlength="12" autocomplete="new-password" autofocus required>
    </label>
    <label class="field">
      <span>Confirm new password</span>
      <input name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
    </label>
    <button class="btn btn-primary" type="submit"><i data-lucide="lock-keyhole"></i>Save new password</button>
  </form>
  <p class="auth-links"><a href="{{ url_for('login') }}">Back to sign in</a></p>
{% endblock %}
